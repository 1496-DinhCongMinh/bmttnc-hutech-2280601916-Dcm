<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ceasar Cipher</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <table class="table">
        <tr>
          <td class="text-center fw-bold">Ceasar Cipher</td>
        </tr>
        <tr>
          <td class="fw-bold" style="color: blue">ENCRYPTION</td>
        </tr>
        <tr>
          <td>
            <form method="post" action="/encrypt">
              <div class="mb-3">
                <label class="form-label">PlainText: </label>
                <input
                  type="text"
                  class="form-control"
                  name="InputPlainText"
                  placeholder="Input Plain Text"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Key: </label>
                <input
                  type="number"
                  class="form-control"
                  name="InputKeyPlain"
                  placeholder="Input Key Text"
                  required
                />
              </div>
              <button class="btn btn-primary">Encrypt</button>
            </form>
          </td>
        </tr>
        <tr>
          <td class="text-center fw-bold">Ceasar Cipher</td>
        </tr>
        <tr>
          <td class="fw-bold" style="color: blue">DECRYPTION</td>
        </tr>
        <tr>
          <td>
            <form method="post" action="/decrypt">
              <div class="mb-3">
                <label class="form-label">CipherText: </label>
                <input
                  type="text"
                  class="form-control"
                  name="InputCipherText"
                  placeholder="Input Cipher Text"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Key: </label>
                <input
                  type="number"
                  class="form-control"
                  name="InputKeyCipher"
                  placeholder="Input Key Text"
                  required
                />
              </div>
              <button class="btn btn-primary">Encrypt</button>
            </form>
          </td>
        </tr>
      </table>
    </div>
    <!-- Nhúng JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
